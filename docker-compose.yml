services:
  backend:
#    build:
#      context: .
#      dockerfile: Dockerfile
#      target: production
#      args:
#        - NODE_ENV=production

    image: nguyenduc1603/edtech-be:1.1.01
    container_name: edtechbackend

    # config container truy cập host qua host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "3331:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
